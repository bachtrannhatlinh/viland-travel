version: '3.8'

services:
  # Database services
  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vilandtravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "7000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vilandtravel-network

  redis:
    image: redis:7-alpine
    ports:
      - "6666:6379"
    volumes:
      - redis_data:/data
    networks:
      - vilandtravel-network

  # Backend API
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
    env_file:
      - ./apps/server/.env
      - ./apps/server/.env.database
      - ./apps/server/.env.payment
    depends_on:
      - postgresql
      - redis
    networks:
      - vilandtravel-network
    restart: unless-stopped

  # Admin Dashboard
  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - server
    networks:
      - vilandtravel-network
    restart: unless-stopped

  # User Web App
  web-user:
    build:
      context: ./apps/web-user
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - server
    networks:
      - vilandtravel-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vilandtravel-network:
    driver: bridge
